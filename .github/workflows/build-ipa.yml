name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build BolaMinhDuc (unsigned)
        run: |
          xcodebuild \
            -project BolaMinhDuc.xcodeproj \
            -target BolaMinhDuc \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/bola"

      - name: Build IntexX (unsigned)
        run: |
          xcodebuild \
            -project BolaMinhDuc.xcodeproj \
            -target IntexX \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/intexX"

      - name: Package unsigned IPAs
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build/bola/BolaMinhDuc.app Payload/
          zip -qry MinDoCheat-unsigned.ipa Payload
          # giữ tên cũ làm bản dự phòng để link cũ đã chia sẻ không chết
          cp MinDoCheat-unsigned.ipa BolaMinhDuc-unsigned.ipa
          rm -rf Payload && mkdir -p Payload
          cp -R build/intexX/BolaMinhDuc.app Payload/
          zip -qry IntexX-unsigned.ipa Payload
          ls -la MinDoCheat-unsigned.ipa BolaMinhDuc-unsigned.ipa IntexX-unsigned.ipa

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipas
          path: |
            MinDoCheat-unsigned.ipa
            BolaMinhDuc-unsigned.ipa
            IntexX-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Releases (overwrite each build)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          cat > RELEASE_NOTES.md <<'NOTES'
          MINDO CHEAT (iOS) — luôn là bản build MỚI NHẤT (file IPA được ghi đè sau mỗi lần build).

          **Ký trước khi cài:** file `.ipa` này chưa được ký (unsigned).
          Dùng Esign / Sideloadly + chứng chỉ enterprise để ký rồi cài lên máy.

          Nội dung: app SwiftUI + kernel exploit/sandbox escape (vendored từ 3105, GPL-3.0)
          để cài patch `Assembly-CSharp-patch.bytes` vào Free Fire.
          NOTES
          cat > INTEXX_NOTES.md <<'NOTES'
          INTEXX (iOS) — bản build MỚI NHẤT (file IPA được ghi đè sau mỗi lần build).

          **Ký trước khi cài:** file `.ipa` này chưa được ký (unsigned).
          Dùng Esign / Sideloadly + chứng chỉ enterprise để ký rồi cài lên máy.
          NOTES
          if ! gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create latest --repo "$REPO" \
              --title "BOLAMINHDUC (bản mới nhất)" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          gh release upload latest MinDoCheat-unsigned.ipa --clobber --repo "$REPO"
          gh release upload latest BolaMinhDuc-unsigned.ipa --clobber --repo "$REPO"
          gh release edit latest --repo "$REPO" --title "MinDo Cheat (bản mới nhất)"
          if ! gh release view intexx --repo "$REPO" >/dev/null 2>&1; then
            gh release create intexx --repo "$REPO" \
              --title "INTEXX (bản mới nhất)" \
              --notes-file INTEXX_NOTES.md \
              --latest=false
          fi
          gh release upload intexx IntexX-unsigned.ipa --clobber --repo "$REPO"
