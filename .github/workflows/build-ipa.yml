name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BolaPatch.xcodeproj \
            -target BolaPatch \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/BolaPatch.app Payload/
          zip -qry BolaPatch-unsigned.ipa Payload
          ls -la BolaPatch-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BolaPatch-unsigned-ipa
          path: BolaPatch-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cat > RELEASE_NOTES.md <<'NOTES'
          BOLA PATCH (iOS) — bản build tự động.

          **Ký trước khi cài:** file `.ipa` này chưa được ký (unsigned).
          Dùng Esign / Sideloadly + chứng chỉ enterprise để ký rồi cài lên máy.

          Nội dung: app SwiftUI + kernel exploit/sandbox escape (vendored từ 3105, GPL-3.0)
          để cài patch `Assembly-CSharp-patch.bytes` vào Free Fire.
          NOTES
          gh release create "$TAG" BolaPatch-unsigned.ipa \
            --repo "${{ github.repository }}" \
            --title "BOLA PATCH $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
