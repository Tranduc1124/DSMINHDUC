name: BolaMinhDuc
options:
  bundleIdPrefix: com.bolaminhduc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  BolaMinhDuc:
    type: application
    platform: iOS
    sources:
      - path: BolaMinhDuc
        excludes:
          - "Info.plist"
    info:
      path: BolaMinhDuc/Info.plist
      properties:
        CFBundleDisplayName: BOLAMINHDUC
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - freefire
        NSLocalNetworkUsageDescription: "Cần cho tính năng ghép đôi thiết bị (pairing file)."
        NSBonjourServices:
          - "_remotepairing._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bolaminhduc.bolapatch
        PRODUCT_NAME: BolaMinhDuc
        SWIFT_OBJC_BRIDGING_HEADER: BolaMinhDuc/BolaMinhDuc-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/vendor/idevice"
        OTHER_LDFLAGS: "-lz -lc++ $(SRCROOT)/vendor/idevice/libidevice_ffi.a"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
