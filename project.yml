name: BolaMinhDuc
options:
  bundleIdPrefix: com.bolaminhduc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  BolaMinhDuc:
    type: application
    platform: iOS
    sources:
      - path: BolaMinhDuc
        excludes:
          - "Info.plist"
          - "Info-IntexX.plist"
    info:
      path: BolaMinhDuc/Info.plist
      properties:
        CFBundleDisplayName: MinDo Cheat
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        TserverPkgToken: pkg_X8XdjK6znj5erui-NyA-u1c2Nx8hmwuB
        BolaProduct: bola
        BolaOfflineMaxDays: 0
        BolaTelegram: https://t.me/ntphax
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - freefire
        CFBundleURLTypes:
          - CFBundleURLName: com.bolaminhduc.license
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - bolaminhduc
    settings:
      base:
        # ĐỔI BUNDLE (né anti-cheat quét): trước đây để
        # com.apple.mobile.MobileHouseArrest (trick MHA để mượn đường vào
        # container game KHÔNG cần kernel) — nhưng bundle đó lộ thiên với mọi
        # scan của game. Giờ dùng id thường, không cần MHA: app tự chạy
        # kernel exploit (hỗ trợ iOS ≤ 17.7) để lấy quyền vào container.
        PRODUCT_BUNDLE_IDENTIFIER: com.minhduc.photovault
        PRODUCT_NAME: BolaMinhDuc
        SWIFT_OBJC_BRIDGING_HEADER: BolaMinhDuc/BolaMinhDuc-Bridging-Header.h
        OTHER_LDFLAGS: "-lz -lc++ -ObjC -L$(SRCROOT)/BolaMinhDuc/vendor/APIClient -lAPIClient"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: Security.framework
      - sdk: SafariServices.framework

  IntexX:
    type: application
    platform: iOS
    sources:
      - path: BolaMinhDuc
        excludes:
          - "Info.plist"
          - "Info-IntexX.plist"
          - "Assets.xcassets"
      - path: IntexXAssets
    info:
      path: BolaMinhDuc/Info-IntexX.plist
      properties:
        CFBundleDisplayName: IntexX
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        TserverPkgToken: pkg_mTFXvnoFw3wHbPCO44Sxvb53LKNCJghQ
        BolaProduct: intexx
        BolaOfflineMaxDays: 3
        BolaTelegram: https://t.me/intexxcheat
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - freefire
        CFBundleURLTypes:
          - CFBundleURLName: com.bolaminhduc.license
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - bolaminhduc
    settings:
      base:
        # ĐỔI BUNDLE (né anti-cheat quét) — như bản BolaMinhDuc, không dùng
        # MHA nữa; app tự chạy kernel exploit để vào container game.
        PRODUCT_BUNDLE_IDENTIFIER: com.intex.videoplayer
        PRODUCT_NAME: BolaMinhDuc
        SWIFT_OBJC_BRIDGING_HEADER: BolaMinhDuc/BolaMinhDuc-Bridging-Header.h
        OTHER_LDFLAGS: "-lz -lc++ -ObjC -L$(SRCROOT)/BolaMinhDuc/vendor/APIClient -lAPIClient"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: Security.framework
      - sdk: SafariServices.framework
